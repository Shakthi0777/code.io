<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SportX</title><style>body{margin:0;background:#0a100e;color:#f5f6ef;font:16px Arial;padding:24px}main{max-width:1000px;margin:auto}.brand{color:#bdf65a;font-weight:bold}.hero{padding:75px 0;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:58px;margin:12px 0}.hero em{color:#bdf65a}.ball{font-size:140px}.btn{background:#bdf65a;border:0;padding:14px 20px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#17211e;padding:22px;border:1px solid #33443a}.card h3{font-size:22px}.meta{color:#a1a99f}.join{color:#bdf65a;background:0;border:0;padding:0;font-weight:bold;cursor:pointer}@media(max-width:650px){.hero{display:block}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}}</style></head><body><main><header><h2 class="brand">✦ SPORTX</h2></header><section class="hero"><div><small class="brand">YOUR GAME. YOUR COMMUNITY.</small><h1>Every athlete needs a <em>home team.</em></h1><p>Find your next game, track your growth, and connect with athletes who move like you do.</p><button class="btn" onclick="welcome()">Join SportX →</button></div><div class="ball">⚽</div></section><section><small class="brand">MAKE A MOVE</small><h2>Find your next challenge.</h2><div class="grid" id="events"></div></section></main><script>let events=JSON.parse(localStorage.sportx||'null')||[['⚽ Football','City 5-a-side Cup','Sep 21 · Arena North',32,40],['🏀 Basketball','Weekend Hoops League','Sep 23 · Downtown Court',18,24],['🏃 Running','Sunrise 10K Run','Sep 28 · Riverside Track',76,120]];function render(){eventsEl=document.querySelector('#events');eventsEl.innerHTML=events.map((e,i)=>'<article class="card"><div>'+e[0]+'</div><h3>'+e[1]+'</h3><p class="meta">'+e[2]+'<br>'+e[3]+'/'+e[4]+' spots</p><button class="join" onclick="join('+i+')">Join event →</button></article>').join('')}function welcome(){let n=prompt('Your name?');if(n)localStorage.name=n}function join(i){if(!localStorage.name)return welcome();if(events[i][3]>=events[i][4])return alert('This event is full');events[i][3]++;localStorage.sportx=JSON.stringify(events);render();alert('You are on the roster, '+localStorage.name+'!')}render()</script></body></html>
